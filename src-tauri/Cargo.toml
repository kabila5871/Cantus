[package]
name = "cantus"
version = "0.1.0"
description = "Cantus — a Claude-first coding environment"
authors = ["Manan Wadhwa"]
edition = "2021"

[lib]
name = "cantus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

