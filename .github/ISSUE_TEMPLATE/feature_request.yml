name: Feature request
description: Suggest an idea for Cantus
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Which phase does this belong to?
      options:
        - Phase 1 (MVP — committed)
        - Phase 2 (depth — debugging, skills, subagents)
        - Phase 3 (orchestration — agent teams, workflows, multi-project)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
