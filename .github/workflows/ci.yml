name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Typecheck + build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tauri build script validates externalBin (binaries/node) existence even
      # for clippy/test. CI doesn't bundle, so stub it with the runner's own node.
      - name: Stub node sidecar for build script
        run: |
          mkdir -p src-tauri/binaries
          cp "$(command -v node)" src-tauri/binaries/node-aarch64-apple-darwin

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml
